<!doctype html>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f3f4f2">
<title>Luci Tokens Preview</title>
<script>/*
 * Luci theme bootstrap. Paste this INLINE in <head>, before any stylesheet,
 * so the right theme is set before first paint (no flash of the wrong theme).
 *
 *   1. A script element whose body is this file's contents
 *   2. Then the stylesheet link to /css/index.css
 *
 * Stored preference: localStorage "luci-theme" = "light" | "dark" | "system" (default).
 * Resolved theme goes on <html data-theme="light|dark">; the preference on data-theme-pref.
 */
(function () {
  var pref = 'system';
  try { pref = localStorage.getItem('luci-theme') || 'system'; } catch (e) {}
  var dark = pref === 'dark' ||
    (pref === 'system' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
  var root = document.documentElement;
  root.setAttribute('data-theme', dark ? 'dark' : 'light');
  root.setAttribute('data-theme-pref', pref);
})();
</script>

  --sidebar-border: var(--color-border-subtle);
  --sidebar-item-hover: var(--color-background-hover);
  --sidebar-item-active-background: var(--color-background-selected);
  --sidebar-item-active-foreground: var(--color-text-selected);
  --sidebar-item-active-indicator: var(--color-border-selected);

  /* tabs */
  --tabs-foreground: var(--color-text-secondary);
  --tabs-foreground-active: var(--color-text-primary);
  --tabs-indicator: var(--color-border-selected);

  /* popover */
  --popover-background: var(--color-background-surface-overlay);
  --popover-border: var(--color-border-default);
  --popover-shadow: var(--elevation-overlay);
  --popover-radius: var(--radius-lg);

  /* tooltip */
  --tooltip-background: var(--color-background-surface-inverse);
  --tooltip-foreground: var(--color-text-inverse);
  --tooltip-radius: var(--radius-sm);

  /* modal */
  --modal-background: var(--color-background-surface-overlay);
  --modal-shadow: var(--elevation-modal);
  --modal-radius: var(--radius-xl);
  --modal-scrim: var(--color-background-scrim);

  /* table */
  --table-header-background: var(--color-background-surface-sunken);
  --table-row-border: var(--color-border-subtle);
  --table-row-hover: var(--color-background-hover);
  --table-row-selected: var(--color-background-selected);

  /* toast */
  --toast-background: var(--color-background-surface-inverse);
  --toast-foreground: var(--color-text-inverse);

  /* onboarding */
  --onboarding-spotlight-scrim: var(--color-background-scrim);
  --onboarding-spotlight-ring: var(--color-focus-ring);
  --onboarding-tip-background: var(--color-background-surface-overlay);
  --onboarding-tip-border: var(--color-border-selected);

  /* progress */
  --progress-track: var(--color-background-surface-sunken);
  --progress-fill: var(--color-action-primary-background);

  /* skeleton */
  --skeleton-base: var(--color-background-hover);
  --skeleton-highlight: var(--color-background-surface);

  /* empty-state */
  --empty-state-icon-background: var(--color-background-selected);
  --empty-state-icon-foreground: var(--color-text-link);
}

/*
 * Reference component styles. Every colour, size and duration comes from a token;
 * there are no hex values in this file. Copy the patterns, not necessarily the class names.
 */

*, *::before, *::after { box-sizing: border-box; }

html { background: var(--color-background-canvas); color: var(--color-text-primary); }
body { margin: 0; font: var(--type-body-md); letter-spacing: var(--type-body-md-tracking); }
@media (min-width: 1024px) { .app { font: var(--type-body-sm); } }

/* One frame without transitions while the theme flips (set by js/theme.js). */
.theme-switching *, .theme-switching *::before, .theme-switching *::after { transition: none !important; }

/* Shared focus treatment: 2px ring with a 2px gap in the canvas colour. */
:where(button, a, input, select, textarea, [tabindex]):focus-visible {
  outline: var(--border-width-2) solid var(--color-focus-ring);
  outline-offset: 2px;
}

/* ------------------------------------------------------------------ Button */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--space-inline-xs);
  min-height: var(--button-height-lg);                 /* 48px touch target on mobile */
  padding: 0 var(--space-16);
  border: var(--border-width-1) solid transparent;
  border-radius: var(--button-radius);
  font: var(--type-label);
  cursor: pointer;
  transition:
    background-color var(--motion-hover-duration) var(--motion-hover-easing),
    border-color var(--motion-hover-duration) var(--motion-hover-easing),
    transform var(--motion-feedback-duration) var(--motion-feedback-easing);
}
@media (min-width: 1024px) { .btn { min-height: var(--button-height-md); } }
.btn:active:not(:disabled) { transform: scale(0.98); }

.btn--primary { background: var(--button-primary-background); color: var(--button-primary-foreground); }
.btn--primary:hover:not(:disabled) { background: var(--button-primary-hover); }
.btn--primary:active:not(:disabled) { background: var(--button-primary-pressed); }

.btn--secondary {
  background: var(--button-secondary-background); color: var(--button-secondary-foreground);
  border-color: var(--button-secondary-border);
}
.btn--secondary:hover:not(:disabled) { background: var(--button-secondary-hover); border-color: var(--color-border-hover); }

.btn--tonal { background: var(--color-action-tonal-background); color: var(--color-action-tonal-foreground); }
.btn--tonal:hover:not(:disabled) { background: var(--color-action-tonal-hover); }

.btn--danger { background: var(--color-action-danger-background); color: var(--color-action-danger-foreground); }
.btn--danger:hover:not(:disabled) { background: var(--color-action-danger-hover); }

.btn--ghost { background: transparent; color: var(--color-text-primary); }
.btn--ghost:hover:not(:disabled) { background: var(--button-ghost-hover); }

.btn:disabled, .btn[aria-disabled="true"] {
  background: var(--color-action-disabled-background); color: var(--color-text-disabled);
  border-color: transparent; cursor: not-allowed;
}

/* Loading keeps the button's width: the label stays in the layout, invisibly. */
.btn[aria-busy="true"] { position: relative; color: transparent; pointer-events: none; }
.btn[aria-busy="true"]::after {
  content: ""; position: absolute; width: 16px; height: 16px; border-radius: var(--radius-full);
  border: var(--border-width-2) solid var(--button-primary-foreground); border-right-color: transparent;
  animation: luci-spin 700ms var(--easing-linear) infinite;
}
.btn--secondary[aria-busy="true"]::after { border-color: var(--color-text-primary); border-right-color: transparent; }
@keyframes luci-spin { to { transform: rotate(360deg); } }

/* ------------------------------------------------------------------ Input */
.field { display: grid; gap: var(--space-stack-xs); }
.field__label { font: var(--type-label); color: var(--color-text-primary); }
.field__help { font: var(--type-caption); letter-spacing: var(--type-caption-tracking); color: var(--color-text-muted); }
.field__error { font: var(--type-caption); color: var(--color-status-danger-foreground); display: flex; gap: var(--space-4); }

.input {
  width: 100%; min-height: var(--size-control-lg);
  padding: 0 var(--space-inline-md);
  background: var(--input-background); color: var(--input-foreground);
  border: var(--border-width-1) solid var(--input-border); border-radius: var(--input-radius);
  font: var(--type-body-md);
  transition: border-color var(--motion-hover-duration) var(--motion-hover-easing);
}
@media (min-width: 1024px) { .input { min-height: var(--input-height); font: var(--type-body-sm); } }
.input::placeholder { color: var(--input-placeholder); }
.input:hover:not(:disabled) { border-color: var(--input-border-hover); }
.input:focus-visible { border-color: var(--input-border-focus); }
.input[aria-invalid="true"] { border-color: var(--input-border-error); border-width: var(--border-width-2); }
.input:disabled { background: var(--input-background-disabled); color: var(--color-text-disabled); cursor: not-allowed; }

/* ------------------------------------------------------------------ Card */
.card {
  background: var(--card-background);
  border: var(--border-width-1) solid var(--card-border);
  border-radius: var(--card-radius);
  box-shadow: var(--card-shadow);
  padding: var(--space-inset-card);
}
@media (min-width: 768px) { .card { padding: var(--space-inset-card-lg); } }
.card[aria-selected="true"] { border: var(--border-width-2) solid var(--color-border-selected); }
.card__title { font: var(--type-title-card); margin: 0 0 var(--space-stack-sm); }
.card__meta { color: var(--color-text-secondary); }

/* ------------------------------------------------------------------ Sidebar navigation */
.sidebar {
  width: var(--size-sidebar);
  background: var(--sidebar-background);
  border-right: var(--border-width-1) solid var(--sidebar-border);
  padding: var(--space-12);
}
.nav-item {
  display: flex; align-items: center; gap: var(--space-inline-sm);
  min-height: var(--size-control-md); padding: 0 var(--space-12);
  border-radius: var(--radius-md); color: var(--color-text-secondary); text-decoration: none;
  position: relative;
  transition: background-color var(--motion-hover-duration) var(--motion-hover-easing);
}
.nav-item:hover { background: var(--sidebar-item-hover); color: var(--color-text-primary); }
.nav-item[aria-current="page"] {
  background: var(--sidebar-item-active-background);
  color: var(--sidebar-item-active-foreground);
  font-weight: var(--font-weight-semibold);           /* non-colour cue 1 */
}
.nav-item[aria-current="page"]::before {               /* non-colour cue 2 */
  content: ""; position: absolute; left: 0; top: var(--space-8); bottom: var(--space-8);
  width: var(--border-width-2); border-radius: var(--radius-full);
  background: var(--sidebar-item-active-indicator);
}

/* ------------------------------------------------------------------ Modal */
.scrim {
  position: fixed; inset: 0; z-index: var(--z-modal);
  background: var(--modal-scrim);
  display: grid; place-items: center; padding: var(--space-gutter);
  animation: luci-fade var(--motion-modal-exit-duration) var(--motion-popover-enter-easing);
}
.modal {
  width: min(520px, 100%);
  background: var(--modal-background);
  border: var(--border-width-1) solid var(--color-border-default);
  border-radius: var(--modal-radius);
  box-shadow: var(--modal-shadow);
  padding: var(--space-24);
  animation: luci-modal-in var(--motion-modal-enter-duration) var(--motion-modal-enter-easing);
}
.modal__title { font: var(--type-title-section); margin: 0 0 var(--space-stack-sm); }
.modal__actions { display: flex; justify-content: flex-end; gap: var(--space-inline-sm); margin-top: var(--space-stack-lg); }
@keyframes luci-fade { from { opacity: 0; } }
@keyframes luci-modal-in { from { opacity: 0; transform: scale(0.96); } }

/* ------------------------------------------------------------------ Status badge (colour + icon + word) */
.badge {
  display: inline-flex; align-items: center; gap: var(--space-4);
  padding: var(--space-2) var(--space-8); border-radius: var(--radius-sm);
  font: var(--type-caption); letter-spacing: var(--type-caption-tracking);
}
.badge--success { background: var(--color-status-success-background); color: var(--color-status-success-foreground); }
.badge--warning { background: var(--color-status-warning-background); color: var(--color-status-warning-foreground); }
.badge--danger  { background: var(--color-status-danger-background);  color: var(--color-status-danger-foreground); }
.badge--info    { background: var(--color-status-info-background);    color: var(--color-status-info-foreground); }
.badge--accent  { background: var(--color-accent-background);         color: var(--color-accent-foreground); }

/* ------------------------------------------------------------------ Tooltip, skeleton, progress */
.tooltip {
  background: var(--tooltip-background); color: var(--tooltip-foreground);
  border-radius: var(--tooltip-radius); padding: var(--space-4) var(--space-8);
  font: var(--type-caption); box-shadow: var(--popover-shadow);
}
.skeleton {
  border-radius: var(--radius-sm);
  background: linear-gradient(90deg, var(--skeleton-base) 25%, var(--skeleton-highlight) 50%, var(--skeleton-base) 75%) 0 0 / 300% 100%;
  animation: luci-shimmer var(--motion-skeleton-duration) var(--motion-skeleton-easing) infinite;
}
@keyframes luci-shimmer { to { background-position: -150% 0; } }
.progress { height: 8px; border-radius: var(--radius-full); background: var(--progress-track); overflow: hidden; }
.progress > span {
  display: block; height: 100%; background: var(--progress-fill); border-radius: inherit;
  transition: width var(--motion-progress-duration) var(--motion-progress-easing);
}

/* ------------------------------------------------------------------ Reduced motion: no travel, no scale */
@media (prefers-reduced-motion: reduce) {
  .btn:active:not(:disabled) { transform: none; }
  @keyframes luci-modal-in { from { opacity: 0; } }
  .skeleton { animation: none; background: var(--skeleton-base); }
}


/* Preview page layout only */
.page-head { display: flex; flex-wrap: wrap; gap: var(--space-16); align-items: center; justify-content: space-between;
  padding: var(--space-24) var(--space-gutter); border-bottom: var(--border-width-1) solid var(--color-border-subtle); }
.page-head h1 { font: var(--type-title-page); letter-spacing: var(--type-title-page-tracking); margin: 0; }
.page-head p { margin: var(--space-4) 0 0; color: var(--color-text-secondary); }
.seg { display: inline-flex; padding: var(--space-2); gap: var(--space-2); border-radius: var(--radius-md);
  background: var(--color-background-surface-sunken); }
.seg button { border: 0; background: transparent; color: var(--color-text-secondary); font: var(--type-label);
  min-height: var(--size-control-sm); padding: 0 var(--space-12); border-radius: var(--radius-sm); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--color-background-surface); color: var(--color-text-primary);
  box-shadow: var(--elevation-raised); }
.themes { display: grid; grid-template-columns: 1fr; }
@media (min-width: 1100px) { .themes { grid-template-columns: 1fr 1fr; } }
.theme-pane { background: var(--color-background-canvas); color: var(--color-text-primary); padding: var(--space-24) var(--space-gutter); min-width: 0; }
.theme-pane > h2 { font: var(--type-caption); letter-spacing: 0.06em; text-transform: uppercase; color: var(--color-text-muted); margin: 0 0 var(--space-16); }
.shell { display: flex; border: var(--border-width-1) solid var(--color-border-default); border-radius: var(--radius-lg); overflow: hidden; min-height: 520px; }
.shell .sidebar { flex: none; width: 200px; }
.shell main { flex: 1; min-width: 0; padding: var(--space-20); display: grid; gap: var(--space-stack-lg); align-content: start; }
.brand { font: var(--type-title-card); padding: var(--space-8) var(--space-12) var(--space-16); display: flex; gap: var(--space-8); align-items: center; }
.brand i { width: 20px; height: 20px; border-radius: var(--radius-sm); background: var(--color-accent-background); display: inline-block; }
.row { display: flex; flex-wrap: wrap; gap: var(--space-inline-sm); align-items: center; }
.stack { display: grid; gap: var(--space-stack-md); }
.title { font: var(--type-title-section); letter-spacing: var(--type-title-section-tracking); margin: 0; }
.sub { color: var(--color-text-secondary); margin: var(--space-4) 0 0; }
.muted { color: var(--color-text-muted); font: var(--type-caption); }
.link { color: var(--color-text-link); text-decoration: underline; }
.swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: var(--space-8); }
.sw { border-radius: var(--radius-md); border: var(--border-width-1) solid var(--color-border-default); overflow: hidden; font: var(--type-caption); }
.sw b { display: block; height: 40px; }
.sw span { display: block; padding: var(--space-4) var(--space-8); color: var(--color-text-secondary); }
.table { width: 100%; border-collapse: collapse; }
.table th { text-align: left; font: var(--type-caption); color: var(--color-text-secondary); background: var(--table-header-background); padding: var(--space-8) var(--space-12); }
.table td { padding: var(--space-8) var(--space-12); border-top: var(--border-width-1) solid var(--table-row-border); }
.table tr[aria-selected="true"] td { background: var(--table-row-selected); color: var(--color-text-selected); }
.table tbody tr:hover td { background: var(--table-row-hover); }
.inline-modal { position: relative; border-radius: var(--radius-lg); overflow: hidden; }
.inline-modal .scrim { position: absolute; animation: none; }
.inline-modal .modal { animation: none; }
.tip { background: var(--onboarding-tip-background); border: var(--border-width-2) solid var(--onboarding-tip-border);
  border-radius: var(--radius-lg); box-shadow: var(--popover-shadow); padding: var(--space-12) var(--space-16); max-width: 280px; }
.step { display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: var(--radius-full);
  background: var(--color-accent-background); color: var(--color-accent-foreground); font: var(--type-caption); font-weight: 600; }
.chart { display: flex; align-items: flex-end; gap: var(--space-8); height: 96px; padding-top: var(--space-8);
  border-bottom: var(--border-width-1) solid var(--color-chart-axis); }
@media (max-width: 720px) { .shell .sidebar { display: none; } }
.chart span { flex: 1; border-radius: var(--radius-sm) var(--radius-sm) 0 0; }
</style>
</head>
<body>
<header class="page-head">
  <div>
    <h1>Luci tokens</h1>
    <p>Same components, both themes. Use the switch to test runtime theming of the whole page.</p>
  </div>
  <div class="seg" role="group" aria-label="Theme">
    <button type="button" data-set="light">Light</button>
    <button type="button" data-set="dark">Dark</button>
    <button type="button" data-set="system">System</button>
  </div>
</header>

<div class="themes">
</div>

<template id="pane">
  <h2>{{THEME}} theme</h2>
  <div class="shell">
    <nav class="sidebar" aria-label="Main">
      <div class="brand"><i aria-hidden="true"></i>Luci</div>
      <a class="nav-item" href="#" aria-current="page">Briefs</a>
      <a class="nav-item" href="#">Creators</a>
      <a class="nav-item" href="#">Payments</a>
      <a class="nav-item" href="#">Settings</a>
    </nav>
    <main>
      <div>
        <h3 class="title">Skincare launch: 30-second unboxing</h3>
        <p class="sub">Live · 23 creators notified · <a class="link" href="#">View brief</a></p>
      </div>

      <div class="row">
        <button class="btn btn--primary">Publish brief</button>
        <button class="btn btn--tonal">Save draft</button>
        <button class="btn btn--secondary">Preview</button>
        <button class="btn btn--ghost">Cancel</button>
        <button class="btn btn--primary" aria-busy="true">Saving</button>
        <button class="btn btn--primary" disabled>Disabled</button>
        <button class="btn btn--danger">Delete</button>
      </div>

      <div class="row">
        <span class="badge badge--success">✓ Paid</span>
        <span class="badge badge--warning">! Due soon</span>
        <span class="badge badge--danger">✕ Rejected</span>
        <span class="badge badge--info">i In review</span>
        <span class="badge badge--accent">New</span>
      </div>

      <div class="stack">
        <label class="field"><span class="field__label">Budget (₦)</span>
          <input class="input" placeholder="e.g. 150,000"><span class="field__help">Typical for unboxing: ₦80,000–₦200,000</span></label>
        <label class="field"><span class="field__label">Deadline</span>
          <input class="input" value="12 Nov" aria-invalid="true"><span class="field__error">✕ Pick a date at least 3 days away</span></label>
        <label class="field"><span class="field__label">Usage rights</span>
          <input class="input" value="Organic social only" disabled></label>
      </div>

      <div class="card" aria-selected="true">
        <p class="card__title">Adaeze O. <span class="badge badge--success">✓ Shortlisted</span></p>
        <p class="card__meta">14 briefs completed · 98% on time · 4.9 rating</p>
        <div class="progress" aria-label="Profile 60% complete"><span style="width:60%"></span></div>
      </div>

      <table class="table">
        <thead><tr><th>Creator</th><th>Rate</th><th>Status</th></tr></thead>
        <tbody>
          <tr aria-selected="true"><td>Adaeze O.</td><td style="font-family:var(--font-family-mono)">₦120,000</td><td>Shortlisted</td></tr>
          <tr><td>Tunde B.</td><td style="font-family:var(--font-family-mono)">₦95,000</td><td>Applied</td></tr>
        </tbody>
      </table>

      <div class="row" style="align-items:flex-start">
        <div class="tip"><span class="step">2</span> <b>Shortlist creators</b><p class="muted" style="margin:var(--space-4) 0 0">Tap the star on anyone you like. You can shortlist up to 5.</p></div>
        <div class="tooltip">Rates include usage rights</div>
      </div>

      <div class="stack" style="gap:var(--space-8)">
        <div class="skeleton" style="height:14px;width:70%"></div>
        <div class="skeleton" style="height:14px;width:45%"></div>
      </div>

      <div class="chart" aria-label="Applications by day">
        <span style="height:40%;background:var(--color-chart-series-1)"></span>
        <span style="height:75%;background:var(--color-chart-series-2)"></span>
        <span style="height:55%;background:var(--color-chart-series-3)"></span>
        <span style="height:30%;background:var(--color-chart-series-4)"></span>
      </div>

      <div class="inline-modal" style="height:220px">
        <div class="scrim"><div class="modal" role="dialog" aria-labelledby="m-{{THEME}}">
          <h4 class="modal__title" id="m-{{THEME}}">Hire Adaeze?</h4>
          <p class="sub">₦120,000 goes into escrow and is released when you approve the video.</p>
          <div class="modal__actions"><button class="btn btn--secondary">Not yet</button><button class="btn btn--primary">Pay into escrow</button></div>
        </div></div>
      </div>
    </main>
  </div>
</template>

<script>
  // Render the template once per theme (the light/dark panes are scoped with data-theme).
  const tpl = document.getElementById('pane').innerHTML;
  const host = document.querySelector('.themes');
  host.innerHTML = ['light', 'dark'].map(t =>
    `<section class="theme-pane" data-theme="${t}">${tpl.replaceAll('{{THEME}}', t)}</section>`).join('');
  // Whole-page switch (this is the production code path from js/theme.js, inlined).
  const KEY = 'luci-theme';
  function setTheme(p) {
    try { p === 'system' ? localStorage.removeItem(KEY) : localStorage.setItem(KEY, p); } catch (e) {}
    const dark = p === 'dark' || (p === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    document.querySelectorAll('[data-set]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.set === p)));
  }
  let pref = 'system'; try { pref = localStorage.getItem(KEY) || 'system'; } catch (e) {}
  document.querySelectorAll('[data-set]').forEach(b => b.addEventListener('click', () => setTheme(b.dataset.set)));
  setTheme(pref);
</script>
</body>
