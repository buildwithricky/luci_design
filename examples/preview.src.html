<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f3f4f2">
<title>Luci Tokens Preview</title>
<script>/*INLINE:js/theme-init.js*/</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap">
<style>
/*INLINE:css/primitives.css*/
/*INLINE:css/foundation.css*/
/*INLINE:css/semantic.css*/
/*INLINE:css/components.css*/
/*INLINE:examples/components.css*/

/* Preview page layout only */
.page-head { display: flex; flex-wrap: wrap; gap: var(--space-16); align-items: center; justify-content: space-between;
  padding: var(--space-24) var(--space-gutter); border-bottom: var(--border-width-1) solid var(--color-border-subtle); }
.page-head h1 { font: var(--type-title-page); letter-spacing: var(--type-title-page-tracking); margin: 0; }
.page-head p { margin: var(--space-4) 0 0; color: var(--color-text-secondary); }
.seg { display: inline-flex; padding: var(--space-2); gap: var(--space-2); border-radius: var(--radius-md);
  background: var(--color-background-surface-sunken); }
.seg button { border: 0; background: transparent; color: var(--color-text-secondary); font: var(--type-label);
  min-height: var(--size-control-sm); padding: 0 var(--space-12); border-radius: var(--radius-sm); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--color-background-surface); color: var(--color-text-primary);
  box-shadow: var(--elevation-raised); }
.themes { display: grid; grid-template-columns: 1fr; }
@media (min-width: 1100px) { .themes { grid-template-columns: 1fr 1fr; } }
.theme-pane { background: var(--color-background-canvas); color: var(--color-text-primary); padding: var(--space-24) var(--space-gutter); min-width: 0; }
.theme-pane > h2 { font: var(--type-caption); letter-spacing: 0.06em; text-transform: uppercase; color: var(--color-text-muted); margin: 0 0 var(--space-16); }
.shell { display: flex; border: var(--border-width-1) solid var(--color-border-default); border-radius: var(--radius-lg); overflow: hidden; min-height: 520px; }
.shell .sidebar { flex: none; width: 200px; }
.shell main { flex: 1; min-width: 0; padding: var(--space-20); display: grid; gap: var(--space-stack-lg); align-content: start; }
.brand { font: var(--type-title-card); padding: var(--space-8) var(--space-12) var(--space-16); display: flex; gap: var(--space-8); align-items: center; }
.brand i { width: 20px; height: 20px; border-radius: var(--radius-sm); background: var(--color-accent-background); display: inline-block; }
.row { display: flex; flex-wrap: wrap; gap: var(--space-inline-sm); align-items: center; }
.stack { display: grid; gap: var(--space-stack-md); }
.title { font: var(--type-title-section); letter-spacing: var(--type-title-section-tracking); margin: 0; }
.sub { color: var(--color-text-secondary); margin: var(--space-4) 0 0; }
.muted { color: var(--color-text-muted); font: var(--type-caption); }
.link { color: var(--color-text-link); text-decoration: underline; }
.swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: var(--space-8); }
.sw { border-radius: var(--radius-md); border: var(--border-width-1) solid var(--color-border-default); overflow: hidden; font: var(--type-caption); }
.sw b { display: block; height: 40px; }
.sw span { display: block; padding: var(--space-4) var(--space-8); color: var(--color-text-secondary); }
.table { width: 100%; border-collapse: collapse; }
.table th { text-align: left; font: var(--type-caption); color: var(--color-text-secondary); background: var(--table-header-background); padding: var(--space-8) var(--space-12); }
.table td { padding: var(--space-8) var(--space-12); border-top: var(--border-width-1) solid var(--table-row-border); }
.table tr[aria-selected="true"] td { background: var(--table-row-selected); color: var(--color-text-selected); }
.table tbody tr:hover td { background: var(--table-row-hover); }
.inline-modal { position: relative; border-radius: var(--radius-lg); overflow: hidden; }
.inline-modal .scrim { position: absolute; animation: none; }
.inline-modal .modal { animation: none; }
.tip { background: var(--onboarding-tip-background); border: var(--border-width-2) solid var(--onboarding-tip-border);
  border-radius: var(--radius-lg); box-shadow: var(--popover-shadow); padding: var(--space-12) var(--space-16); max-width: 280px; }
.step { display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: var(--radius-full);
  background: var(--color-accent-background); color: var(--color-accent-foreground); font: var(--type-caption); font-weight: 600; }
.chart { display: flex; align-items: flex-end; gap: var(--space-8); height: 96px; padding-top: var(--space-8);
  border-bottom: var(--border-width-1) solid var(--color-chart-axis); }
@media (max-width: 720px) { .shell .sidebar { display: none; } }
.chart span { flex: 1; border-radius: var(--radius-sm) var(--radius-sm) 0 0; }
</style>
</head>
<body>
<header class="page-head">
  <div>
    <h1>Luci tokens</h1>
    <p>Same components, both themes. Use the switch to test runtime theming of the whole page.</p>
  </div>
  <div class="seg" role="group" aria-label="Theme">
    <button type="button" data-set="light">Light</button>
    <button type="button" data-set="dark">Dark</button>
    <button type="button" data-set="system">System</button>
  </div>
</header>

<div class="themes">
  <!--PANE:light-->
  <!--PANE:dark-->
</div>

<template id="pane">
  <h2>{{THEME}} theme</h2>
  <div class="shell">
    <nav class="sidebar" aria-label="Main">
      <div class="brand"><i aria-hidden="true"></i>Luci</div>
      <a class="nav-item" href="#" aria-current="page">Briefs</a>
      <a class="nav-item" href="#">Creators</a>
      <a class="nav-item" href="#">Payments</a>
      <a class="nav-item" href="#">Settings</a>
    </nav>
    <main>
      <div>
        <h3 class="title">Skincare launch: 30-second unboxing</h3>
        <p class="sub">Live · 23 creators notified · <a class="link" href="#">View brief</a></p>
      </div>

      <div class="row">
        <button class="btn btn--primary">Publish brief</button>
        <button class="btn btn--tonal">Save draft</button>
        <button class="btn btn--secondary">Preview</button>
        <button class="btn btn--ghost">Cancel</button>
        <button class="btn btn--primary" aria-busy="true">Saving</button>
        <button class="btn btn--primary" disabled>Disabled</button>
        <button class="btn btn--danger">Delete</button>
      </div>

      <div class="row">
        <span class="badge badge--success">✓ Paid</span>
        <span class="badge badge--warning">! Due soon</span>
        <span class="badge badge--danger">✕ Rejected</span>
        <span class="badge badge--info">i In review</span>
        <span class="badge badge--accent">New</span>
      </div>

      <div class="stack">
        <label class="field"><span class="field__label">Budget (₦)</span>
          <input class="input" placeholder="e.g. 150,000"><span class="field__help">Typical for unboxing: ₦80,000–₦200,000</span></label>
        <label class="field"><span class="field__label">Deadline</span>
          <input class="input" value="12 Nov" aria-invalid="true"><span class="field__error">✕ Pick a date at least 3 days away</span></label>
        <label class="field"><span class="field__label">Usage rights</span>
          <input class="input" value="Organic social only" disabled></label>
      </div>

      <div class="card" aria-selected="true">
        <p class="card__title">Adaeze O. <span class="badge badge--success">✓ Shortlisted</span></p>
        <p class="card__meta">14 briefs completed · 98% on time · 4.9 rating</p>
        <div class="progress" aria-label="Profile 60% complete"><span style="width:60%"></span></div>
      </div>

      <table class="table">
        <thead><tr><th>Creator</th><th>Rate</th><th>Status</th></tr></thead>
        <tbody>
          <tr aria-selected="true"><td>Adaeze O.</td><td style="font-family:var(--font-family-mono)">₦120,000</td><td>Shortlisted</td></tr>
          <tr><td>Tunde B.</td><td style="font-family:var(--font-family-mono)">₦95,000</td><td>Applied</td></tr>
        </tbody>
      </table>

      <div class="row" style="align-items:flex-start">
        <div class="tip"><span class="step">2</span> <b>Shortlist creators</b><p class="muted" style="margin:var(--space-4) 0 0">Tap the star on anyone you like. You can shortlist up to 5.</p></div>
        <div class="tooltip">Rates include usage rights</div>
      </div>

      <div class="stack" style="gap:var(--space-8)">
        <div class="skeleton" style="height:14px;width:70%"></div>
        <div class="skeleton" style="height:14px;width:45%"></div>
      </div>

      <div class="chart" aria-label="Applications by day">
        <span style="height:40%;background:var(--color-chart-series-1)"></span>
        <span style="height:75%;background:var(--color-chart-series-2)"></span>
        <span style="height:55%;background:var(--color-chart-series-3)"></span>
        <span style="height:30%;background:var(--color-chart-series-4)"></span>
      </div>

      <div class="inline-modal" style="height:220px">
        <div class="scrim"><div class="modal" role="dialog" aria-labelledby="m-{{THEME}}">
          <h4 class="modal__title" id="m-{{THEME}}">Hire Adaeze?</h4>
          <p class="sub">₦120,000 goes into escrow and is released when you approve the video.</p>
          <div class="modal__actions"><button class="btn btn--secondary">Not yet</button><button class="btn btn--primary">Pay into escrow</button></div>
        </div></div>
      </div>
    </main>
  </div>
</template>

<script>
  // Render the template once per theme (the light/dark panes are scoped with data-theme).
  const tpl = document.getElementById('pane').innerHTML;
  const host = document.querySelector('.themes');
  host.innerHTML = ['light', 'dark'].map(t =>
    `<section class="theme-pane" data-theme="${t}">${tpl.replaceAll('{{THEME}}', t)}</section>`).join('');
  // Whole-page switch (this is the production code path from js/theme.js, inlined).
  const KEY = 'luci-theme';
  function setTheme(p) {
    try { p === 'system' ? localStorage.removeItem(KEY) : localStorage.setItem(KEY, p); } catch (e) {}
    const dark = p === 'dark' || (p === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    document.querySelectorAll('[data-set]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.set === p)));
  }
  let pref = 'system'; try { pref = localStorage.getItem(KEY) || 'system'; } catch (e) {}
  document.querySelectorAll('[data-set]').forEach(b => b.addEventListener('click', () => setTheme(b.dataset.set)));
  setTheme(pref);
</script>
</body>
</html>
